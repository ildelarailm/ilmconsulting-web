<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILM Consulting · Consulting estratégico y operacional</title>
<meta name="description" content="ILM Consulting · Consulting estratégico y operacional. Web en construcción.">
<style>
  :root { --bg:#ffffff; --fg:#2b3350; --muted:#6b7390; --line:#e3e6ee; }
  * { box-sizing:border-box; margin:0; }
  html, body { background:var(--bg); }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:32px; padding:48px 16px; color:var(--fg); text-align:center;
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .logo { width:100%; max-width:620px; height:auto; display:block; }
  .badge { display:inline-block; padding:8px 18px; border:1px solid var(--line); border-radius:999px;
           font-size:15px; letter-spacing:.04em; color:var(--muted); }
  p { color:var(--muted); font-size:16px; line-height:1.5; }
  a { color:var(--fg); text-underline-offset:3px; }
</style>
</head>
<body>
  <h1>ILM Consulting</h1>
  <img class="logo" src="logo.svg" alt="ILM Consulting · Consulting estratégico y operacional">
  <span class="badge">Web en construcción</span>
  <p>Mientras tanto, puedes escribirnos a<br><a href="mailto:ilde@ilmconsulting.es">ilde@ilmconsulting.es</a></p>
</body>
</html>
